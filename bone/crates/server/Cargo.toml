[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bone-server"
path = "src/main.rs"

[dependencies]
ammonia = "4"
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
axum = "0.8"
base64 = "0.22"
ece = "2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.13"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }
mail-parser = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["http2", "native-tls", "native-tls-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "fs", "signal"] }
tokio-native-tls = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
web-push = { version = "0.11", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
